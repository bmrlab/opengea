name: OAuth app example
on:
  push:
    branches: [main]
    paths: ["examples/oauth-app/**", ".github/workflows/oauth-app.yml"]
  pull_request:
    paths: ["examples/oauth-app/**", ".github/workflows/oauth-app.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: examples/oauth-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: examples/oauth-app/.node-version
      - run: npm install --global pnpm@10.30.3
      - run: pnpm install --frozen-lockfile
      - name: Build and test Worker HTTP routes with SQLite
        run: pnpm test
      - run: pnpm type-check
