name: Desk Research
on:
  push:
    paths: ["examples/desk-research/**", ".github/workflows/desk-research.yml"]
  pull_request:
    paths: ["examples/desk-research/**", ".github/workflows/desk-research.yml"]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
      - run: pnpm install --frozen-lockfile
        working-directory: examples/desk-research
      - run: pnpm type-check && pnpm test
        working-directory: examples/desk-research
      - name: Verify immutable iteration snapshots
        working-directory: examples/desk-research
        run: |
          for snapshot in iterations/[0-9][0-9]-*; do
            node scripts/snapshot-iteration.mjs verify "$(basename "$snapshot")"
          done
      - name: Check stage projects
        working-directory: examples/desk-research
        run: |
          for stage in v1-research v2-workbench v3-feishu; do
            node scripts/materialize.mjs "$stage" "$RUNNER_TEMP/$stage"
            pnpm --dir "$RUNNER_TEMP/$stage" install --frozen-lockfile
            pnpm --dir "$RUNNER_TEMP/$stage" type-check
            pnpm --dir "$RUNNER_TEMP/$stage" test
          done
