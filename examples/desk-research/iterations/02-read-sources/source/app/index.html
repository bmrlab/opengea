<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>早餐产品研究台</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header>
      <span>PRODUCT RESEARCH · QUICK START</span>
      <h1>从资料到值得验证的产品机会</h1>
      <p>围绕上班族早餐，区分观察、推断和假设。</p>
    </header>
    <main>
      <section aria-labelledby="research-title">
        <h2 id="research-title">研究对话</h2>
        <div class="actions">
          <button id="new">新建研究</button
          ><button id="refresh">刷新消息与记录</button>
        </div>
        <p id="session">尚未创建对话</p>
        <div id="messages" aria-live="polite"></div>
        <form id="form">
          <label for="input">研究要求或补充条件</label
          ><textarea id="input" rows="5" required maxlength="8000">
研究中国城市上班族到办公室后吃早餐的场景：用户困难、现有解决方案，以及值得验证的产品机会。请附上来源并说明资料缺口。</textarea
          ><button id="send" type="submit">发送研究要求</button>
        </form>
        <p id="notice" role="status"></p>
      </section>
      <section aria-labelledby="records-title">
        <h2 id="records-title">研究记录</h2>
        <p>来自 Agent 写入的同一份 Durable Object 数据。刷新可查看最新简报。</p>
        <div id="records"></div>
      </section>
    </main>
    <script type="module" src="/client.js"></script>
  </body>
</html>
