services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: oauth_app
    ports:
      - "127.0.0.1:5448:5432"
    volumes:
      - oauth-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oauth_app"]
      interval: 2s
      timeout: 2s
      retries: 20
volumes:
  oauth-data:
